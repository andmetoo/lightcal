[package]
name = "lightcal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lightweight native Windows calendar for the system tray and taskbar"

[dependencies]
calendar-core = { path = "../calendar-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdue = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
socket2 = "0.6"
url = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
chrono-tz = "0.10"
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
] }

[target.'cfg(windows)'.dependencies]
# Default features only add Linux GTK backends; Lightcal uses these crates on Windows.
tray-icon = { version = "0.26", default-features = false }
muda = { version = "0.21", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel_Appointments",
    "Foundation",
    "Foundation_Collections",
    "UI",
    "Web_Http",
    "Web_Http_Headers",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

