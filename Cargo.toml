[workspace]
resolver = "2"
members = [
    "crates/calendar-core",
    "crates/lightcal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/andmetoo/lightcal"
homepage = "https://koona.app"
rust-version = "1.80"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

