<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightcal settings, App tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}
.st{--page:#F3F3F3;--card:#FFFFFF;--cardline:#E8E8E8;--ink:#202020;--ink2:#646464;--ink3:#707070;--line:#F0F0F0;--ctrl:#FFFFFF;--ctrlline:#E0E0E0;--ctrlbottom:#CECECE;--track:#EBEBEB;--thumb:#FFFFFF;--hover:#F0F0F0;--accent:#00796B;--toggleoff:#838383;--key:#F0F0F0}
.st.dark{--page:#191919;--card:#222222;--cardline:#2A2A2A;--ink:#EEEEEE;--ink2:#B4B4B4;--ink3:#8A8A8A;--line:#2E2E2E;--ctrl:#2A2A2A;--ctrlline:#333333;--ctrlbottom:#3F3F3F;--track:#161616;--thumb:#3A3A3A;--hover:#2A2A2A;--accent:#53B9AB;--toggleoff:#7B7B7B;--key:#363636}
.cap{width:46px;height:32px;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cap:hover{background:var(--hover)}
.cap.x:hover{background:#C42B1C;color:#FFFFFF}
.tab{position:relative;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink2);text-decoration:none;border-radius:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:3px;margin-left:-8px;border-radius:1.5px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:8px}
.r{position:relative;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink)}
.r+.r::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--line)}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--track)}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:transparent;font:500 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--ink)}
.r.tall{height:48px}
.seg.big button{height:36px;padding:0 12px 0 8px;gap:8px;font-size:13px}
.seg button.on{background:var(--thumb);color:var(--ink);box-shadow:0 0 0 1px var(--ctrlline),0 1px 2px rgba(0,0,0,.08)}
.dd{height:28px;min-width:136px;padding:0 8px 0 10px;border-radius:6px;background:var(--ctrl);border:1px solid var(--ctrlline);border-bottom-color:var(--ctrlbottom);display:inline-flex;align-items:center;justify-content:space-between;gap:8px;font:400 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);cursor:pointer;box-sizing:border-box}
.btn{height:28px;padding:0 10px;border-radius:6px;background:var(--ctrl);border:1px solid var(--ctrlline);border-bottom-color:var(--ctrlbottom);display:inline-flex;align-items:center;gap:6px;font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);cursor:pointer;box-sizing:border-box}
.btn:hover,.dd:hover{background:var(--hover)}
.kbd{height:20px;min-width:20px;padding:0 6px;border-radius:4px;background:var(--key);box-shadow:inset 0 -1px 0 var(--ctrlbottom);display:inline-flex;align-items:center;justify-content:center;font:600 11px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);box-sizing:border-box}
.clr{width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.clr:hover{background:var(--hover);color:var(--ink)}
.tg{position:relative;width:40px;height:20px;border-radius:10px;border:1px solid var(--toggleoff);background:transparent;padding:0;cursor:pointer;box-sizing:border-box}
.tg span{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:6px;background:var(--toggleoff);transition:all .12s}
.tg.on{background:#00796B;border-color:#00796B}
.tg.on span{top:2px;left:21px;width:14px;height:14px;border-radius:7px;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{font:500 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink2);text-decoration:none;border-radius:4px;padding:2px 4px;margin-left:-4px}
.lnk:hover{color:var(--ink);background:var(--hover)}
</style>
</helmet>
<div class="{{rootCls}}" style="width: 448px; height: 360px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 32px; display: flex; align-items: center; flex-shrink: 0">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; padding-left: 12px">
      <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#D73840"></rect><path d="M4 18A14 14 0 0 1 18 4H46A14 14 0 0 1 60 18Z" fill="#A92A31"></path><rect x="18" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="18" y="41" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="41" width="12" height="12" rx="3" fill="#FFFFFF"></rect></svg>
      <span style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">Lightcal settings</span>
    </div>
    <button class="cap x" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
  </div>
  <nav aria-label="Settings sections" style="height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--cardline); flex-shrink: 0">
    <a class="tab" href="SettingsCalendar.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Calendar</a>
    <a class="tab" href="SettingsAccounts.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Accounts</a>
    <a class="tab on" href="SettingsApp.dc.html" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 9h8M8 15h5"></path></svg>App</a>
  </nav>
  <div style="flex-grow: 1; min-height: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
    <div class="card">
      <div class="r">
        <span>Language</span>
        <button class="dd" aria-haspopup="listbox">English<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink2)"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <div class="r">
        <span>Start with Windows</span>
        <button class="{{startCls}}" role="switch" aria-checked="{{start}}" aria-label="Start with Windows" onClick="{{toggleStart}}"><span></span></button>
      </div>
      <div class="r">
        <span>Open shortcut</span>
        <div class="dd" style="min-width: 0; padding: 0 4px 0 6px; gap: 4px; cursor: text" aria-label="Open shortcut: Ctrl Alt K">
          <span class="kbd">Ctrl</span><span class="kbd">Alt</span><span class="kbd">K</span>
          <button class="clr" aria-label="Clear shortcut"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="r tall">
        <span>Tray icon</span>
        <div class="seg big" role="group" aria-label="Tray icon style">
          <button class="{{colorCls}}" aria-pressed="{{isColor}}" onClick="{{pickColor}}"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="6" fill="#D73840"></rect><path d="M1 7A6 6 0 0 1 7 1H25A6 6 0 0 1 31 7Z" fill="#A92A31"></path><text x="16" y="25.8" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1</text></svg>Color</button>
          <button class="{{monoCls}}" aria-pressed="{{isMono}}" onClick="{{pickMono}}"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M1 7A6 6 0 0 1 7 1H25A6 6 0 0 1 31 7Z" fill="currentColor"></path><text x="16" y="25.8" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif" font-size="19" font-weight="700" fill="currentColor">1</text></svg>Mono</button>
        </div>
      </div>
      <div class="r">
        <span>Updates</span>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="display: inline-flex; align-items: center; gap: 5px; font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Up to date</span>
          <button class="btn">Check now</button>
        </div>
      </div>
    </div>
  </div>
  <div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid var(--cardline); flex-shrink: 0">
    <a class="lnk" href="WinAbout.dc.html">About Lightcal</a>
    <span style="display: flex; align-items: center; gap: 12px"><a class="lnk" href="https://github.com/sponsors/andmetoo" style="display: inline-flex; align-items: center; gap: 5px; margin-left: 0"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 L4.6 13.8 A5 5 0 0 1 12 6.6 A5 5 0 0 1 19.4 13.8 Z" fill="#D73840" stroke="#D73840" stroke-width="1.5" stroke-linejoin="round"></path></svg>Sponsor</a><span style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink3)">Version 1.0.3</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":448,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var start = st.start != null ? st.start : false;
    var tray = st.tray || "color";
    var dark = (this.props.theme || "dark") === "dark";
    return {
      rootCls: "st" + (dark ? " dark" : ""),
      start: String(start), startCls: "tg" + (start ? " on" : ""),
      toggleStart: function () { self.setState({ start: !start }); },
      isColor: String(tray === "color"), isMono: String(tray === "mono"),
      colorCls: tray === "color" ? "on" : "", monoCls: tray === "mono" ? "on" : "",
      pickColor: function () { self.setState({ tray: "color" }); },
      pickMono: function () { self.setState({ tray: "mono" }); }
    };
  }
}
</script>
</body>
</html>
