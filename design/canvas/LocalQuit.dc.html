<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightcal quit prompt after a failed save</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.q{--page:#F3F3F3;--card:#FFFFFF;--cardline:#E8E8E8;--ink:#202020;--ink2:#646464;--ctrl:#FFFFFF;--ctrlline:#E0E0E0;--ctrlbottom:#CECECE;--hover:#F0F0F0;--accent:#00796B;--warn:#8A5300;--warnbg:#FFF4E0}
.q.dark{--page:#191919;--card:#222222;--cardline:#2A2A2A;--ink:#EEEEEE;--ink2:#B4B4B4;--ctrl:#2A2A2A;--ctrlline:#333333;--ctrlbottom:#3F3F3F;--hover:#2A2A2A;--accent:#53B9AB;--warn:#F2B866;--warnbg:#33291A}
.btn{height:30px;min-width:96px;padding:0 12px;border-radius:6px;background:var(--ctrl);border:1px solid var(--ctrlline);border-bottom-color:var(--ctrlbottom);font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:var(--hover)}
.pb{height:30px;min-width:96px;padding:0 12px;border:0;border-radius:6px;background:#00796B;color:#FFFFFF;font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.pb:hover{background:#00695C}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cap{width:46px;height:32px;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div class="{{rootCls}}" role="alertdialog" aria-labelledby="qh" aria-describedby="qd" style="width: 400px; height: 188px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 32px; display: flex; align-items: center; flex-shrink: 0">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; padding-left: 12px">
      <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#D73840"></rect><path d="M4 18A14 14 0 0 1 18 4H46A14 14 0 0 1 60 18Z" fill="#A92A31"></path><rect x="18" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="18" y="41" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="41" width="12" height="12" rx="3" fill="#FFFFFF"></rect></svg>
      <span style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">Lightcal</span>
    </div>
    <span class="cap" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></span>
  </div>
  <div style="flex-grow: 1; display: flex; gap: 12px; padding: 8px 20px 0">
    <span style="width: 32px; height: 32px; border-radius: 16px; background: var(--warnbg); color: var(--warn); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg></span>
    <div>
      <div id="qh" style="font: 600 15px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif">Quit and lose unsaved events?</div>
      <div id="qd" style="margin-top: 4px; font: 400 13px/18px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">Lightcal couldn’t save your last change to events on this PC. If you quit now, that change is lost.</div>
    </div>
  </div>
  <div style="height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 20px; background: var(--card); border-top: 1px solid var(--cardline); flex-shrink: 0">
    <button class="btn">Quit anyway</button>
    <button class="pb" style="outline: 2px solid var(--accent); outline-offset: 2px">Keep Lightcal open</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":188}}'>
class Component extends DCLogic {
  renderVals() { return { rootCls: "q" + ((this.props.theme || "light") === "dark" ? " dark" : "") }; }
}
</script>
</body>
</html>
