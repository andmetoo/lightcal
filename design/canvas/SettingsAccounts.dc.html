<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightcal settings, Accounts tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}
.st{--page:#F3F3F3;--card:#FFFFFF;--cardline:#E8E8E8;--ink:#202020;--ink2:#646464;--ink3:#707070;--line:#F0F0F0;--ctrl:#FFFFFF;--ctrlline:#E0E0E0;--ctrlbottom:#CECECE;--track:#EBEBEB;--thumb:#FFFFFF;--hover:#F0F0F0;--accent:#00796B;--toggleoff:#838383;--avatar:#E6F4F1}
.st.dark{--page:#191919;--card:#222222;--cardline:#2A2A2A;--ink:#EEEEEE;--ink2:#B4B4B4;--ink3:#8A8A8A;--line:#2E2E2E;--ctrl:#2A2A2A;--ctrlline:#333333;--ctrlbottom:#3F3F3F;--track:#161616;--thumb:#3A3A3A;--hover:#2A2A2A;--accent:#53B9AB;--toggleoff:#7B7B7B;--avatar:#1C2E2B}
.cap{width:46px;height:32px;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cap:hover{background:var(--hover)}
.cap.x:hover{background:#C42B1C;color:#FFFFFF}
.tab{position:relative;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink2);text-decoration:none;border-radius:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:3px;width:16px;height:3px;margin-left:-8px;border-radius:1.5px;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--cardline);border-radius:8px}
.btn{height:28px;padding:0 10px;border-radius:6px;background:var(--ctrl);border:1px solid var(--ctrlline);border-bottom-color:var(--ctrlbottom);display:inline-flex;align-items:center;gap:6px;font:500 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);cursor:pointer;box-sizing:border-box}
.btn:hover{background:var(--hover)}
.ib{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:hover{background:var(--hover);color:var(--ink)}
.cr{position:relative;height:30px;padding:0 12px;display:flex;align-items:center;gap:10px;font:400 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink);cursor:pointer;border-radius:6px;margin:0 4px}
.cr:hover{background:var(--hover)}
.cb{width:16px;height:16px;border-radius:4px;border:1px solid var(--toggleoff);background:transparent;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0;margin-left:auto;cursor:pointer;color:#FFFFFF}
.cb.on{background:#00796B;border-color:#00796B}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{font:500 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:var(--ink2);text-decoration:none;border-radius:4px;padding:2px 4px;margin-left:-4px}
.lnk:hover{color:var(--ink);background:var(--hover)}
</style>
</helmet>
<div class="{{rootCls}}" style="width: 448px; height: 360px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 32px; display: flex; align-items: center; flex-shrink: 0">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; padding-left: 12px">
      <svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="14" fill="#D73840"></rect><path d="M4 18A14 14 0 0 1 18 4H46A14 14 0 0 1 60 18Z" fill="#A92A31"></path><rect x="18" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="25" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="18" y="41" width="12" height="12" rx="3" fill="#FFFFFF" fill-opacity=".55"></rect><rect x="34" y="41" width="12" height="12" rx="3" fill="#FFFFFF"></rect></svg>
      <span style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">Lightcal settings</span>
    </div>
    <button class="cap x" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
  </div>
  <nav aria-label="Settings sections" style="height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--cardline); flex-shrink: 0">
    <a class="tab" href="SettingsCalendar.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>Calendar</a>
    <a class="tab on" href="SettingsAccounts.dc.html" aria-current="page"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Accounts</a>
    <a class="tab" href="SettingsApp.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 9h8M8 15h5"></path></svg>App</a>
  </nav>
  <div style="flex-grow: 1; min-height: 0; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
    <div style="height: 28px; display: flex; align-items: center; justify-content: space-between">
      <span style="font: 600 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">Connected accounts</span>
      <button class="btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add account</button>
    </div>
    <div class="card" style="padding-bottom: 4px">
      <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: var(--avatar); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; flex-shrink: 0">A</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font: 600 13px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink)">Google Calendar</div>
          <div style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">alex@example.com · Updated 2 min ago</div>
        </div>
        <button class="ib" aria-label="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg></button>
        <button class="ib" aria-label="More account actions" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
      </div>
      <div style="height: 1px; background: var(--line); margin: 0 12px 4px"></div>
      <sc-for list="{{cals}}" as="c" hint-placeholder-count="3">
        <div class="cr" onClick="{{c.pick}}">
          <span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.color}}; flex-shrink: 0"></span>
          <span>{{c.name}}</span>
          <button class="{{c.cls}}" role="checkbox" aria-checked="{{c.on}}" aria-label="Show {{c.name}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{c.tick}}"><path d="M20 6 9 17l-5-5"></path></svg></button>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 0 4px; font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink2)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Read-only. Lightcal never changes your events.
    </div>
  </div>
  <div style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid var(--cardline); flex-shrink: 0">
    <a class="lnk" href="WinAbout.dc.html">About Lightcal</a>
    <span style="display: flex; align-items: center; gap: 12px"><a class="lnk" href="https://github.com/sponsors/andmetoo" style="display: inline-flex; align-items: center; gap: 5px; margin-left: 0"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 L4.6 13.8 A5 5 0 0 1 12 6.6 A5 5 0 0 1 19.4 13.8 Z" fill="#D73840" stroke="#D73840" stroke-width="1.5" stroke-linejoin="round"></path></svg>Sponsor</a><span style="font: 400 12px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; color: var(--ink3)">Version 1.0.0</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":448,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var on = st.on || { personal: true, work: true, holidays: false };
    var dark = (this.props.theme || "light") === "dark";
    var list = [
      { id: "personal", name: "Personal", color: "#D9822B" },
      { id: "work", name: "Work", color: "#3B82C4" },
      { id: "holidays", name: "Public holidays", color: "#2E9D5B" }
    ];
    return {
      rootCls: "st" + (dark ? " dark" : ""),
      cals: list.map(function (c) {
        var v = !!on[c.id];
        return {
          name: c.name, color: c.color, on: String(v), cls: "cb" + (v ? " on" : ""), tick: v ? "1" : "0",
          pick: function () { var n = Object.assign({}, on); n[c.id] = !v; self.setState({ on: n }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
