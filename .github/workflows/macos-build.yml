name: macOS build and notarization
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun scripts/check-docs.ts
      - run: bun test scripts
      - run: cargo fmt --all -- --check
      # Compile the opt-in diagnostic path, without running a desktop app in CI.
      - run: cargo clippy --workspace --all-targets --features native-smoke --locked -- -D warnings
      - run: cargo test --workspace --features native-smoke --locked
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    concurrency:
      group: lightcal-release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: macos-15
    environment: macos-release
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_GOOGLE_CLIENT_ID: ${{ vars.LIGHTCAL_GOOGLE_CLIENT_ID }}
      LIGHTCAL_GOOGLE_CLIENT_SECRET: ${{ secrets.LIGHTCAL_GOOGLE_CLIENT_SECRET }}
      LIGHTCAL_RELEASE_VERSION: ${{ github.ref_name }}
      SPARKLE_VERSION: "2.8.1"
      SPARKLE_SHA256: ${{ vars.SPARKLE_SHA256 }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_PROFILE: lightcal-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - name: Configure temporary signing keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bun scripts/prepare-macos-signing.ts
      - name: Fetch verified Sparkle distribution
        run: |
          test -n "$SPARKLE_SHA256"
          curl --fail --location --proto '=https' "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        run: bun scripts/package-macos.ts --release
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            bun -e 'if (!JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/release.json").text()).isDraft) throw new Error("Release is already public; refusing asset changes")'
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Lightcal $GITHUB_REF_NAME" --notes "Signed macOS build prepared for review."
          fi
          gh release upload "$GITHUB_REF_NAME" target/macos/*.zip target/macos/*.dmg target/macos/*.sha256 target/macos/lightcal-macos-appcast.xml
      - name: Remove signing material
        if: always()
        run: bun scripts/prepare-macos-signing.ts --cleanup
