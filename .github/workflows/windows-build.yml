name: Windows build and NSIS installer

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Unsigned Windows build
    runs-on: windows-latest
    env:
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_UPDATE_CERT_SHA256: ${{ vars.LIGHTCAL_UPDATE_CERT_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in main."
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must be a stable version such as v0.2.0."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build locked release
        run: cargo build --release --workspace --locked

      - name: Stage unsigned review archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ci-package -Force | Out-Null
          Copy-Item target/release/lightcal.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md target/ci-package/
          $hash = (Get-FileHash target/ci-package/lightcal.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lightcal.exe" | Set-Content target/ci-package/lightcal.exe.sha256 -Encoding ascii
          Copy-Item target/ci-package/lightcal.exe target/lightcal-unsigned.exe
          "$hash  lightcal-unsigned.exe" | Set-Content target/lightcal-unsigned.exe.sha256 -Encoding ascii
          Compress-Archive -Path target/ci-package/* -DestinationPath target/lightcal-windows-x64-unsigned.zip

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: ./scripts/package-nsis.ps1 -SkipBuild

      - name: Smoke-test isolated installation and uninstallation
        shell: pwsh
        run: ./scripts/test-nsis.ps1

      - name: Upload unsigned build for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightcal-windows-x64-unsigned
          path: |
            target/lightcal-windows-x64-unsigned.zip
            target/lightcal-unsigned.exe
            target/lightcal-unsigned.exe.sha256
            target/nsis/*-setup.exe
            target/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Open unsigned draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lightcal-windows-x64-unsigned
          path: release-assets

      - name: Open unsigned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to open a draft for unexpected tag: $tag" >&2
            exit 1
          fi
          mapfile -t zips < <(find release-assets -type f -name '*.zip' | sort)
          mapfile -t setups < <(find release-assets -type f -name '*-setup.exe' | sort)
          mapfile -t exes < <(find release-assets -type f -name 'lightcal-unsigned.exe' | sort)
          mapfile -t exe_sums < <(find release-assets -type f -name 'lightcal-unsigned.exe.sha256' | sort)
          if [[ ${#zips[@]} -ne 1 || ${#setups[@]} -ne 1 || ${#exes[@]} -ne 1 || ${#exe_sums[@]} -ne 1 ]]; then
            echo "Expected one portable zip, one NSIS setup, and one unsigned executable." >&2
            find release-assets -type f -print >&2
            exit 1
          fi
          mkdir -p named
          cp "${exes[0]}" named/lightcal-unsigned.exe
          cp "${zips[0]}" "named/lightcal-${tag}-windows-x64-unsigned.zip"
          cp "${setups[0]}" "named/lightcal-${tag}-windows-x64-unsigned-setup.exe"
          sum_text="$(tr -d '\r' < "${exe_sums[0]}")"
          expected_name="$(awk '{print $2}' <<< "$sum_text")"
          expected_hash="$(awk '{print $1}' <<< "$sum_text")"
          actual_hash="$(sha256sum named/lightcal-unsigned.exe | awk '{print $1}')"
          if [[ "$expected_name" != "lightcal-unsigned.exe" || "$expected_hash" != "$actual_hash" ]]; then
            echo "Unsigned executable checksum does not match the build." >&2
            exit 1
          fi
          (
            cd named
            printf '%s  lightcal-unsigned.exe\n' "$actual_hash" > lightcal-unsigned.exe.sha256
            sha256sum -c lightcal-unsigned.exe.sha256
            sha256sum "lightcal-${tag}-windows-x64-unsigned.zip" > "lightcal-${tag}-windows-x64-unsigned.zip.sha256"
            sha256sum "lightcal-${tag}-windows-x64-unsigned-setup.exe" > "lightcal-${tag}-windows-x64-unsigned-setup.exe.sha256"
          )
          if [[ -e named/lightcal.exe ]]; then
            echo "Refusing to attach an unsigned file named lightcal.exe." >&2
            exit 1
          fi
          notes="${RUNNER_TEMP}/lightcal-draft-notes.md"
          cat > "$notes" <<EOF
          Unsigned Windows draft for ${tag}.

          These files are not Authenticode-signed. SimpleSign Desktop runs only on the maintainer's Windows PC, so this workflow does not sign them.

          On that PC, check out this tag and run just sign-draft. It downloads lightcal-unsigned.exe, checks the SHA-256, signs the application, builds the NSIS setup from that signed application, signs the setup, and uploads the signed files to this draft.

          The draft stays unpublished. When the signed lightcal.exe asset should become the public release, run just publish-release from the same tag.
          EOF
          title="Lightcal ${tag} (unsigned draft)"
          files=(
            "named/lightcal-unsigned.exe"
            "named/lightcal-unsigned.exe.sha256"
            "named/lightcal-${tag}-windows-x64-unsigned.zip"
            "named/lightcal-${tag}-windows-x64-unsigned.zip.sha256"
            "named/lightcal-${tag}-windows-x64-unsigned-setup.exe"
            "named/lightcal-${tag}-windows-x64-unsigned-setup.exe.sha256"
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing $file" >&2
              exit 1
            fi
          done
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::${tag} is already published. A signed upload needs a new version." >&2
              exit 1
            fi
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --draft=true --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$notes" "${files[@]}"
          fi
          echo "Draft ${tag} is unsigned. On Windows, at this tag: just sign-draft" >> "$GITHUB_STEP_SUMMARY"
