name: Windows build and NSIS installer

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild and attach (for example v0.3.0); empty means review build"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Unsigned Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release-tag.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      LIGHTCAL_RELEASE_VERSION: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_GOOGLE_CLIENT_ID: ${{ vars.LIGHTCAL_GOOGLE_CLIENT_ID }}
      LIGHTCAL_UPDATE_CERT_SHA256: ${{ vars.LIGHTCAL_UPDATE_CERT_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
          fetch-depth: ${{ (inputs.release_tag || startsWith(github.ref, 'refs/tags/')) && '0' || '1' }}

      - name: Verify release tag
        id: release-tag
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) { exit 0 }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must be a stable version such as v0.3.0."
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in main."
          }

          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build locked release
        run: cargo build --release --workspace --locked

      - name: Stage unsigned review archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ci-package -Force | Out-Null
          Copy-Item target/release/lightcal.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md target/ci-package/
          $hash = (Get-FileHash target/ci-package/lightcal.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lightcal.exe" | Set-Content target/ci-package/lightcal.exe.sha256 -Encoding ascii
          Copy-Item target/ci-package/lightcal.exe target/lightcal-unsigned.exe
          "$hash  lightcal-unsigned.exe" | Set-Content target/lightcal-unsigned.exe.sha256 -Encoding ascii
          Compress-Archive -Path target/ci-package/* -DestinationPath target/lightcal-windows-x64-unsigned.zip

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: ./scripts/package-nsis.ps1 -SkipBuild

      - name: Smoke-test isolated installation and uninstallation
        shell: pwsh
        run: ./scripts/test-nsis.ps1

      - name: Upload unsigned build for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightcal-windows-x64-unsigned
          path: |
            target/lightcal-windows-x64-unsigned.zip
            target/lightcal-unsigned.exe
            target/lightcal-unsigned.exe.sha256
            target/nsis/*-setup.exe
            target/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach Windows build to release
    if: needs.portable.outputs.release_tag != ''
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lightcal-windows-x64-unsigned
          path: release-assets

      - name: Attach Windows build to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.portable.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi
          mapfile -t zips < <(find release-assets -type f -name '*.zip' | sort)
          mapfile -t setups < <(find release-assets -type f -name '*-setup.exe' | sort)
          mapfile -t exes < <(find release-assets -type f -name 'lightcal-unsigned.exe' | sort)
          mapfile -t exe_sums < <(find release-assets -type f -name 'lightcal-unsigned.exe.sha256' | sort)
          if [[ ${#zips[@]} -ne 1 || ${#setups[@]} -ne 1 || ${#exes[@]} -ne 1 || ${#exe_sums[@]} -ne 1 ]]; then
            echo "Expected one portable zip, one NSIS setup, and one unsigned executable." >&2
            find release-assets -type f -print >&2
            exit 1
          fi
          mkdir -p named
          version="${tag#v}"
          cp "${exes[0]}" named/lightcal.exe
          cp "${zips[0]}" "named/lightcal-${tag}-windows-x64.zip"
          cp "${setups[0]}" "named/lightcal-${version}-windows-x64-setup.exe"
          sum_text="$(tr -d '\r' < "${exe_sums[0]}")"
          expected_name="$(awk '{print $2}' <<< "$sum_text")"
          expected_hash="$(awk '{print $1}' <<< "$sum_text")"
          actual_hash="$(sha256sum named/lightcal.exe | awk '{print $1}')"
          if [[ "$expected_name" != "lightcal-unsigned.exe" || "$expected_hash" != "$actual_hash" ]]; then
            echo "Unsigned executable checksum does not match the build." >&2
            exit 1
          fi
          (
            cd named
            printf '%s  lightcal.exe\n' "$actual_hash" > lightcal.exe.sha256
            sha256sum -c lightcal.exe.sha256
            sha256sum "lightcal-${tag}-windows-x64.zip" > "lightcal-${tag}-windows-x64.zip.sha256"
            sha256sum "lightcal-${version}-windows-x64-setup.exe" > "lightcal-${version}-windows-x64-setup.exe.sha256"
          )
          notes="${RUNNER_TEMP}/lightcal-draft-notes.md"
          cat > "$notes" <<EOF
          Windows build for ${tag}.

          These files are not Authenticode-signed. SimpleSign Desktop runs only on the maintainer's Windows PC, so this workflow does not sign them.

          On that PC, run just sign-draft ${tag}. It downloads the application, checks SHA-256, signs it, rebuilds NSIS with the signed payload, signs the setup, and replaces the attached files.

          Signing preserves draft/prerelease/public status. Run just publish-release ${tag} to explicitly publish/promote the verified signed release.
          EOF
          title="Lightcal ${tag}"
          files=(
            "named/lightcal.exe"
            "named/lightcal.exe.sha256"
            "named/lightcal-${tag}-windows-x64.zip"
            "named/lightcal-${tag}-windows-x64.zip.sha256"
            "named/lightcal-${version}-windows-x64-setup.exe"
            "named/lightcal-${version}-windows-x64-setup.exe.sha256"
          )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing $file" >&2
              exit 1
            fi
          done
          # An existing release may be a draft, prerelease, or stable release.
          # Never overwrite existing assets: a rerun must not replace signed files.
          if gh release view "$tag" --json assets > existing.json 2>/dev/null; then
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if jq -e --arg name "$name" '.assets | any(.name == $name)' existing.json > /dev/null; then
                echo "Keeping existing asset: $name"
              else
                gh release upload "$tag" "$file"
              fi
            done
          else
            gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$notes" "${files[@]}"
          fi
          echo "Build attached to ${tag}; existing assets and release visibility preserved. On Windows: just sign-draft ${tag}" >> "$GITHUB_STEP_SUMMARY"
