name: Windows build and NSIS installer

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Unsigned Windows build
    runs-on: windows-latest
    env:
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_UPDATE_CERT_SHA256: ${{ vars.LIGHTCAL_UPDATE_CERT_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in main."
          }

          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must be a stable version such as v0.2.0."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build locked release
        run: cargo build --release --workspace --locked

      - name: Stage unsigned review archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ci-package -Force | Out-Null
          Copy-Item target/release/lightcal.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md target/ci-package/
          $hash = (Get-FileHash target/ci-package/lightcal.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lightcal.exe" | Set-Content target/ci-package/lightcal.exe.sha256 -Encoding ascii
          Compress-Archive -Path target/ci-package/* -DestinationPath target/lightcal-windows-x64-unsigned.zip

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: ./scripts/package-nsis.ps1 -SkipBuild

      - name: Smoke-test isolated installation and uninstallation
        shell: pwsh
        run: ./scripts/test-nsis.ps1

      - name: Upload unsigned build for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightcal-windows-x64-unsigned
          path: |
            target/lightcal-windows-x64-unsigned.zip
            target/nsis/*-setup.exe
            target/nsis/*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish unsigned prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lightcal-windows-x64-unsigned
          path: release-assets

      - name: Name Windows zip and NSIS setup
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish unexpected tag: $tag" >&2
            exit 1
          fi
          mapfile -t zips < <(find release-assets -type f -name '*.zip' | sort)
          mapfile -t setups < <(find release-assets -type f -name '*-setup.exe' | sort)
          if [[ ${#zips[@]} -ne 1 || ${#setups[@]} -ne 1 ]]; then
            echo "Expected one portable zip and one NSIS setup." >&2
            find release-assets -type f -print >&2
            exit 1
          fi
          mkdir -p named
          cp "${zips[0]}" "named/lightcal-${tag}-windows-x64-unsigned.zip"
          cp "${setups[0]}" "named/lightcal-${tag}-windows-x64-setup.exe"
          (
            cd named
            sha256sum "lightcal-${tag}-windows-x64-unsigned.zip" > "lightcal-${tag}-windows-x64-unsigned.zip.sha256"
            sha256sum "lightcal-${tag}-windows-x64-setup.exe" > "lightcal-${tag}-windows-x64-setup.exe.sha256"
          )

      - name: Publish unsigned prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Lightcal ${{ github.ref_name }} (unsigned)
          body: |
            Automated unsigned Windows review build from `main`.
            Do not treat these files as an Authenticode-signed production release.
            Attached files are the portable ZIP and the NSIS setup, each with a SHA-256 checksum.
            `lightcal.exe` ProductVersion matches this git tag.
            The macOS disk image is not included.
          files: named/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
