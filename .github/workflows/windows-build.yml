name: Windows build and NSIS installer

# Builds the unsigned Windows artifacts once per commit on main. Version tags reuse
# this artifact in release.yml instead of compiling again. Pull requests run this
# only when packaging inputs change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packaging/**
      - scripts/*nsis*.ps1
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: Unsigned Windows build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_UPDATE_CERT_SHA256: ${{ vars.LIGHTCAL_UPDATE_CERT_SHA256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache portable NSIS compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: nsis-${{ runner.os }}-${{ hashFiles('scripts/prepare-nsis.ps1') }}

      - name: Build locked release
        run: cargo build --release --workspace --locked

      - name: Stage unsigned review archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/ci-package -Force | Out-Null
          Copy-Item target/release/lightcal.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md target/ci-package/
          $hash = (Get-FileHash target/ci-package/lightcal.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lightcal.exe" | Set-Content target/ci-package/lightcal.exe.sha256 -Encoding ascii
          Compress-Archive -Path target/ci-package/* -DestinationPath target/lightcal-windows-x64-unsigned.zip

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: ./scripts/package-nsis.ps1 -SkipBuild

      - name: Smoke-test isolated installation and uninstallation
        shell: pwsh
        run: ./scripts/test-nsis.ps1

      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightcal-windows-x64-unsigned
          path: |
            target/lightcal-windows-x64-unsigned.zip
            target/nsis/*-windows-x64-setup.exe
            target/nsis/*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
