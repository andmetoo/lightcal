name: Windows MSIX package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      LIGHTCAL_MICROSOFT_CLIENT_ID: ${{ vars.LIGHTCAL_MICROSOFT_CLIENT_ID }}
      LIGHTCAL_MSIX_IDENTITY_NAME: ${{ vars.LIGHTCAL_MSIX_IDENTITY_NAME }}
      LIGHTCAL_MSIX_PUBLISHER: ${{ vars.LIGHTCAL_MSIX_PUBLISHER }}
      LIGHTCAL_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.LIGHTCAL_MSIX_PUBLISHER_DISPLAY_NAME }}
      LIGHTCAL_MSIX_DISPLAY_NAME: ${{ vars.LIGHTCAL_MSIX_DISPLAY_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build unsigned package
        shell: pwsh
        run: |
          $preview = [string]::IsNullOrWhiteSpace($env:LIGHTCAL_MSIX_IDENTITY_NAME)
          ./scripts/package-msix.ps1 -Preview:$preview
      - name: Upload package for review or first manual Store submission
        uses: actions/upload-artifact@v4
        with:
          name: lightcal-msix-unsigned
          path: |
            target/msix/**/*.msix
            target/msix/**/*.msix.sha256
          if-no-files-found: error
          retention-days: 14
